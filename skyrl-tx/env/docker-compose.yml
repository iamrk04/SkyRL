# SkyRL-TX Docker Compose
# Runs SkyRL-TX (training) + vLLM (inference) together
#
# Usage:
#   ./start.sh                           # Uses defaults
#   ./start.sh Qwen/Qwen3-0.6B           # Custom model
#   ./start.sh mistralai/Mistral-7B-v0.1 /mnt/data  # Custom model + data dir
#
# Persistent data (mounted from host):
#   - checkpoints/   - Training checkpoints
#   - lora_models/   - Trained LoRA adapters (shared with vLLM)
#   - huggingface/   - Downloaded model cache
#
# Ephemeral data (container-local, auto-cleaned on 'docker compose down'):
#   - /tmp/ray       - Ray temporary files
#   - /tmp/tinker.db - Experiment database

services:
  # vLLM inference server (uses GPUs 4-7)
  vllm:
    image: vllm/vllm-openai:v0.8.5
    user: "0:0"  # Run as root to read LoRA adapters created by skyrl-tx
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['4', '5', '6', '7']
              capabilities: [gpu]
    ports:
      - "7999:8000"
    volumes:
      - ${DATA_DIR:-./data}/lora_models:/lora_models
      - ${DATA_DIR:-./data}/huggingface:/root/.cache/huggingface
    environment:
      - VLLM_ALLOW_RUNTIME_LORA_UPDATING=True
      - VLLM_PLUGINS=lora_filesystem_resolver
      - VLLM_LORA_RESOLVER_CACHE_DIR=/lora_models
    command: >
      --model ${BASE_MODEL:-Qwen/Qwen3-0.6B}
      --tensor-parallel-size 4
      --enable-lora
      --max-lora-rank ${MAX_LORA_RANK:-32}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # SkyRL-TX training server (uses GPUs 0-3)
  skyrl-tx:
    build:
      context: ../..
      dockerfile: skyrl-tx/env/Dockerfile
    user: "0:0"  # Run as root to avoid permission issues with mounted volumes
    shm_size: '64gb'  # Ray needs large shared memory for object store
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1', '2', '3']
              capabilities: [gpu]
    ports:
      - "8000:8000"
    volumes:
      - ${DATA_DIR:-./data}/checkpoints:/data/checkpoints
      - ${DATA_DIR:-./data}/lora_models:/data/lora_models
      - ${DATA_DIR:-./data}/huggingface:/data/huggingface
    environment:
      - HF_HOME=/data/huggingface
    working_dir: /app/skyrl-tx
    command: >
      bash -c "umask 000 && exec uv run --extra gpu --extra tinker --extra skyrl_train
      -m tx.tinker.api
      --base-model ${BASE_MODEL:-Qwen/Qwen3-0.6B}
      --backend skyrl_train
      --database-url sqlite:////tmp/tinker.db
      --checkpoints-base /data/checkpoints
      --external-inference-url http://vllm:8000
      --external-inference-lora-base /data/lora_models"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
